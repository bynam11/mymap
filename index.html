
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리동네 숨은 빵집: 빵지순례 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #49372b;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #fffaf3;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 500px;
    }

    /* 왼쪽 검색창 */
    .sidebar {
      width: 390px;
      min-width: 320px;
      padding: 24px;
      overflow-y: auto;
      background: #fffaf3;
      border-right: 1px solid #eadfd2;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a66b3f;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 16px;
      color: #806f61;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 동네 검색창 */
    .region-search {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }

    .region-search input {
      flex: 1;
      min-width: 0;
      padding: 11px 10px;
      border: 1px solid #dfcdbb;
      border-radius: 9px;
      font-size: 13px;
    }

    .region-search button {
      padding: 10px;
      color: white;
      background: #9b6037;
      border: 1px solid #9b6037;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .location-button {
      width: 100%;
      margin-bottom: 16px;
      padding: 9px;
      color: #76543d;
      background: white;
      border: 1px solid #e6d4c0;
      border-radius: 9px;
      cursor: pointer;
    }

    /* 빵집·카페와 공원 탭 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 8px;
      color: #76543d;
      background: #f3e7d8;
      border: 1px solid #e6d4c0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-button.active {
      color: white;
      background: #9b6037;
      border-color: #9b6037;
    }

    #status {
      margin: 12px 0;
      color: #75675c;
      font-size: 13px;
      line-height: 1.6;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    #resultCount {
      color: #a66b3f;
      font-size: 12px;
      font-weight: normal;
    }

    #resultList {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .place-item {
      padding: 14px 10px;
      border-bottom: 1px solid #eee1d3;
      border-radius: 8px;
      cursor: pointer;
    }

    .place-item:hover,
    .place-item:focus {
      background: #f7eddf;
      outline: none;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
    }

    .place-category {
      margin-bottom: 6px;
      color: #a66b3f;
      font-size: 11px;
    }

    .place-address,
    .place-phone {
      color: #786b60;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .place-phone {
      margin-top: 5px;
    }

    .place-link,
    .info-link {
      display: inline-block;
      margin-top: 8px;
      color: #8b512a;
      font-size: 12px;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #eee9e2;
    }

    .info-content {
      width: 220px;
      padding: 12px;
      color: #49372b;
      font-family: Arial, "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }

    .info-title {
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .info-address,
    .info-phone {
      margin-top: 4px;
      color: #65584d;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 650px) {
      .container {
        flex-direction: column;
        height: 100vh;
        min-height: 600px;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 48%;
        padding: 16px;
      }

      #map {
        width: 100%;
        height: 52%;
        min-height: 250px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 왼쪽: 제목, 지역 검색, 탭, 장소 목록 -->
    <aside class="sidebar">
      <p class="eyebrow">LOCAL BREAD TOUR</p>

      <h1>우리동네 숨은 빵집:<br>빵지순례 지도</h1>

      <p class="description">
        내 주변은 물론, 원하는 동네의 숨은 장소도 찾아보세요.
      </p>

      <!-- 동 단위 지역 검색 -->
      <form id="regionForm" class="region-search">
        <input
          id="regionInput"
          type="text"
          placeholder="예: 성수동 또는 서울 성동구 성수동"
          aria-label="검색할 동네"
        >
        <button type="submit">지역 검색</button>
      </form>

      <button id="currentLocationButton" class="location-button" type="button">
        ◎ 내 현재 위치에서 검색
      </button>

      <!-- 선택한 탭에 따라 설명 문구가 바뀜 -->
      <p id="tabDescription" class="description">
        우리동네에 숨어있는 빵집과 카페를 만나보세요!
      </p>

      <div class="tabs" role="tablist" aria-label="장소 종류">
        <button
          id="bakeryTab"
          class="tab-button active"
          type="button"
          role="tab"
          aria-selected="true"
        >🥐 동네 빵집·카페</button>

        <button
          id="parkTab"
          class="tab-button"
          type="button"
          role="tab"
          aria-selected="false"
        >🌳 공원</button>
      </div>

      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <div class="result-heading">
        <span id="resultTitle">내 주변 빵집·카페</span>
        <span id="resultCount">0곳</span>
      </div>

      <ul id="resultList"></ul>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <div id="map" aria-label="장소 지도"></div>
  </div>

  <script>
    // 카카오 JavaScript 키
    const kakaoKey = "536cd3e4d18f1463bb3acf620a3bcff3";

    // 지도와 검색에 사용할 변수
    let map;
    let placesService;
    let geocoder;
    let currentPosition = null;
    let searchCenter = null;
    let searchRegionName = "";
    let currentMarker = null;
    let placeMarkers = [];
    let infoWindow = null;
    let activeTab = "bakery";
    let searchVersion = 0;

    const statusElement = document.getElementById("status");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const resultTitle = document.getElementById("resultTitle");
    const bakeryTab = document.getElementById("bakeryTab");
    const parkTab = document.getElementById("parkTab");
    const regionForm = document.getElementById("regionForm");
    const regionInput = document.getElementById("regionInput");
    const currentLocationButton =
      document.getElementById("currentLocationButton");
    const tabDescription = document.getElementById("tabDescription");

    // 빵 모양 마커 이미지 생성
    function createBreadMarkerImage() {
      const breadSvg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="48" height="52" viewBox="0 0 48 52">
          <ellipse cx="24" cy="47" rx="12" ry="3"
                   fill="#000000" opacity="0.15"/>
          <path d="M8 31 C4 25 7 16 14 12
                   C18 4 31 5 35 13
                   C43 16 45 25 40 32
                   L37 39 C35 43 13 43 11 39 Z"
                fill="#D99543" stroke="#8B512A" stroke-width="2"/>
          <path d="M16 13 C13 17 13 20 14 23
                   M24 10 C21 14 21 18 22 21
                   M32 13 C29 17 29 20 30 23"
                fill="none" stroke="#FFF0C8"
                stroke-width="3" stroke-linecap="round"/>
        </svg>
      `;

      return new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(breadSvg),
        new kakao.maps.Size(48, 52),
        { offset: new kakao.maps.Point(24, 46) }
      );
    }

    // 카카오맵 SDK를 불러온 뒤 지도 초기화
    function loadKakaoMap() {
      const kakaoScript = document.createElement("script");

      kakaoScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        encodeURIComponent(kakaoKey) +
        "&libraries=services&autoload=false";

      kakaoScript.onload = function () {
        kakao.maps.load(initializeMap);
      };

      kakaoScript.onerror = function () {
        statusElement.textContent =
          "지도를 불러오지 못했어요. 카카오 JavaScript 키와 웹 도메인을 확인해 주세요.";
      };

      document.head.appendChild(kakaoScript);
    }

    // 지도와 검색 서비스 초기화
    function initializeMap() {
      const defaultPosition =
        new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      placesService = new kakao.maps.services.Places();
      geocoder = new kakao.maps.services.Geocoder();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

      // 지역 검색 이벤트
      regionForm.addEventListener("submit", function (event) {
        event.preventDefault();
        searchByRegion();
      });

      // 현재 위치로 돌아가는 버튼
      currentLocationButton.addEventListener("click", function () {
        searchRegionName = "";
        regionInput.value = "";

        if (!currentPosition) {
          requestCurrentLocation();
          return;
        }

        searchCenter = currentPosition;
        map.setLevel(5);
        map.setCenter(currentPosition);
        updateResultTitle();
        searchNearbyPlaces();
      });

      bakeryTab.addEventListener("click", function () {
        changeTab("bakery");
      });

      parkTab.addEventListener("click", function () {
        changeTab("park");
      });

      // 지도 생성 후 위치 권한 요청
      requestCurrentLocation();
    }

    // 브라우저에서 현재 위치 가져오기
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "현재 위치 기능을 지원하지 않는 브라우저예요. 지역 검색을 이용해 주세요.";
        return;
      }

      statusElement.textContent =
        "현재 위치를 확인하고 있어요. 위치 권한 요청을 허용해 주세요.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 지역 검색 중이 아니면 현재 위치를 검색 중심으로 사용
          if (!searchRegionName) {
            searchCenter = currentPosition;
            map.setLevel(5);
            map.setCenter(currentPosition);
          }

          if (currentMarker) {
            currentMarker.setMap(null);
          }

          const currentSvg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="30" height="30" viewBox="0 0 30 30">
              <circle cx="15" cy="15" r="12"
                      fill="#2878E3" stroke="#FFFFFF" stroke-width="4"/>
              <circle cx="15" cy="15" r="4" fill="#FFFFFF"/>
            </svg>
          `;

          const currentImage = new kakao.maps.MarkerImage(
            "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(currentSvg),
            new kakao.maps.Size(30, 30),
            { offset: new kakao.maps.Point(15, 15) }
          );

          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            image: currentImage,
            title: "내 현재 위치",
            zIndex: 20
          });

          if (!searchRegionName) {
            searchNearbyPlaces();
          } else {
            statusElement.textContent =
              "'" + searchRegionName + "' 주변 장소를 검색하고 있어요.";
          }
        },
        function (error) {
          if (error.code === error.PERMISSION_DENIED) {
            statusElement.textContent =
              "위치 권한이 거부됐어요. 지역 검색을 이용하거나 사이트 위치 권한을 허용해 주세요.";
          } else if (error.code === error.TIMEOUT) {
            statusElement.textContent =
              "현재 위치 확인 시간이 초과됐어요. 지역 검색을 이용해 주세요.";
          } else {
            statusElement.textContent =
              "현재 위치를 확인하지 못했어요. 지역 검색을 이용해 주세요.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    // 입력한 동네를 검색해 지도 중심 좌표 설정
    function searchByRegion() {
      const regionName = regionInput.value.trim();

      if (!regionName) {
        statusElement.textContent = "검색할 동네 이름을 입력해 주세요.";
        regionInput.focus();
        return;
      }

      searchVersion++;
      clearResults();

      statusElement.textContent =
        "'" + regionName + "' 지역을 찾고 있어요...";

      // 먼저 주소 검색으로 동네 좌표 찾기
      geocoder.addressSearch(regionName, function (results, resultStatus) {
        if (
          resultStatus === kakao.maps.services.Status.OK &&
          results.length > 0
        ) {
          setRegionCenter(regionName, results[0].y, results[0].x);
          return;
        }

        // 주소 검색 실패 시 해당 이름의 장소 검색으로 위치 추정
        placesService.keywordSearch(regionName, function (places, status) {
          if (
            status === kakao.maps.services.Status.OK &&
            places.length > 0
          ) {
            setRegionCenter(regionName, places[0].y, places[0].x);
          } else {
            statusElement.textContent =
              "지역을 찾지 못했어요. '서울 성동구 성수동'처럼 시·구·동을 함께 입력해 보세요.";
          }
        });
      });
    }

    // 지역 검색 결과를 검색 중심으로 설정
    function setRegionCenter(regionName, latitude, longitude) {
      searchRegionName = regionName;
      searchCenter = new kakao.maps.LatLng(
        Number(latitude),
        Number(longitude)
      );

      map.setLevel(5);
      map.setCenter(searchCenter);

      updateResultTitle();
      searchNearbyPlaces();
    }

    // 현재 탭에 맞게 목록 제목 변경
    function updateResultTitle() {
      const placeLabel =
        activeTab === "bakery" ? "빵집·카페" : "공원";

      resultTitle.textContent = searchRegionName
        ? searchRegionName + " " + placeLabel
        : "내 주변 " + placeLabel;
    }

    // 탭 변경
    function changeTab(tabName) {
      activeTab = tabName;
      searchVersion++;

      bakeryTab.classList.toggle("active", tabName === "bakery");
      parkTab.classList.toggle("active", tabName === "park");

      bakeryTab.setAttribute(
        "aria-selected",
        String(tabName === "bakery")
      );

      parkTab.setAttribute(
        "aria-selected",
        String(tabName === "park")
      );

      tabDescription.textContent =
        tabName === "bakery"
          ? "우리동네에 숨어있는 빵집과 카페를 만나보세요!"
          : "공원에서 여유로운 커피와 디저트는 어떤가요?";

      updateResultTitle();
      clearResults();

      if (!searchCenter) {
        statusElement.textContent =
          "현재 위치를 확인하거나 위 검색창에서 동네를 검색해 주세요.";
        return;
      }

      searchNearbyPlaces();
    }

    // 기존 장소 마커와 목록 지우기
    function clearResults() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];
      resultList.replaceChildren();
      resultCount.textContent = "0곳";

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 선택한 탭의 장소 검색
    function searchNearbyPlaces() {
      if (!searchCenter || !placesService) return;

      const version = ++searchVersion;
      clearResults();
      updateResultTitle();

      statusElement.textContent = searchRegionName
        ? "'" + searchRegionName + "' 주변 장소를 찾고 있어요..."
        : "주변 장소를 찾고 있어요...";

      if (activeTab === "park") {
        searchByKeyword("공원", version, showSearchResults);
      } else {
        searchBakeryAndCafe(version);
      }
    }

    // 키워드로 장소 검색
    function searchByKeyword(keyword, version, callback) {
      placesService.keywordSearch(
        keyword,
        function (data, resultStatus) {
          if (version !== searchVersion) return;

          if (resultStatus === kakao.maps.services.Status.OK) {
            callback(data, version);
          } else {
            callback([], version);
          }
        },
        {
          location: searchCenter,
          radius: 5000,
          sort: kakao.maps.services.SortBy.DISTANCE
        }
      );
    }

    // 카페와 빵집 검색 결과를 합치고 중복 제거
    function searchBakeryAndCafe(version) {
      let completedSearches = 0;
      const allPlaces = [];

      const searchTasks = [
        function (done) {
          placesService.categorySearch(
            "CE7",
            function (data, status) {
              if (version !== searchVersion) return;
              done(status === kakao.maps.services.Status.OK ? data : []);
            },
            {
              location: searchCenter,
              radius: 5000,
              sort: kakao.maps.services.SortBy.DISTANCE
            }
          );
        },
        function (done) {
          searchByKeyword("빵집", version, done);
        },
        function (done) {
          searchByKeyword("베이커리", version, done);
        },
        function (done) {
          searchByKeyword("제과점", version, done);
        }
      ];

      searchTasks.forEach(function (task) {
        task(function (places) {
          if (version !== searchVersion) return;

          allPlaces.push.apply(allPlaces, places);
          completedSearches++;

          if (completedSearches !== searchTasks.length) return;

          const uniquePlaces = [];
          const seenIds = new Set();

          allPlaces.forEach(function (place) {
            if (!seenIds.has(place.id)) {
              seenIds.add(place.id);
              uniquePlaces.push(place);
            }
          });

          // 메가커피를 포함한 주요 프랜차이즈 제외
          const filteredPlaces = uniquePlaces.filter(function (place) {
            return !isFranchise(place);
          });

          filteredPlaces.sort(function (a, b) {
            return getDistance(a) - getDistance(b);
          });

          showSearchResults(filteredPlaces.slice(0, 30), version);
        });
      });
    }

    // 제외할 프랜차이즈 이름 확인
    function isFranchise(place) {
      const placeName = (place.place_name || "")
        .replace(/\s+/g, "")
        .toLowerCase();

      const franchiseNames = [
        "파리바게뜨", "파리바게트", "파리크라상",
        "뚜레쥬르", "투썸플레이스", "스타벅스",
        "이디야", "메가커피", "메가엠지씨커피",
        "megacoffee", "컴포즈커피", "빽다방",
        "더벤티", "커피빈", "할리스", "탐앤탐스",
        "폴바셋", "엔제리너스", "커피베이",
        "매머드커피", "블루보틀", "던킨",
        "크리스피크림", "배스킨라빈스", "공차",
        "설빙", "요거프레소", "디저트39",
        "감성커피", "카페베네", "커피스미스", "아티제"
      ];

      return franchiseNames.some(function (name) {
        return placeName.includes(
          name.replace(/\s+/g, "").toLowerCase()
        );
      });
    }

    // 검색 중심에서 장소까지의 대략적인 거리 계산
    function getDistance(place) {
      const latitude = Number(place.y);
      const longitude = Number(place.x);
      const centerLat = searchCenter.getLat();
      const centerLng = searchCenter.getLng();

      const dy = (latitude - centerLat) * 111000;
      const dx = (longitude - centerLng) *
        111000 * Math.cos(centerLat * Math.PI / 180);

      return Math.sqrt(dx * dx + dy * dy);
    }

    // 검색 결과를 목록과 지도에 표시
    function showSearchResults(places, version) {
      if (version !== searchVersion) return;

      clearResults();

      if (places.length === 0) {
        statusElement.textContent =
          "조건에 맞는 장소를 찾지 못했어요. 다른 지역이나 탭을 선택해 보세요.";
        return;
      }

      places.forEach(function (place, index) {
        addPlaceToMapAndList(place, index);
      });

      resultCount.textContent = places.length + "곳";
      statusElement.textContent = searchRegionName
        ? "'" + searchRegionName + "' 주변에서 " + places.length + "곳을 찾았어요."
        : "주변에서 " + places.length + "곳을 찾았어요.";

      // 검색 중심과 장소가 함께 보이도록 지도 범위 설정
      const bounds = new kakao.maps.LatLngBounds();
      bounds.extend(searchCenter);

      places.forEach(function (place) {
        bounds.extend(new kakao.maps.LatLng(place.y, place.x));
      });

      map.setBounds(bounds);
      map.setLevel(5);
      map.setCenter(searchCenter);
    }

    // 장소 마커, 팝업, 왼쪽 목록 생성
    function addPlaceToMapAndList(place, index) {
      const position = new kakao.maps.LatLng(place.y, place.x);
      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";
      const phone = place.phone || "등록된 전화번호가 없습니다.";

      let markerImage;

      if (activeTab === "bakery") {
        markerImage = createBreadMarkerImage();
      } else {
        const parkSvg = `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="42" height="46" viewBox="0 0 42 46">
            <path d="M21 3 L25 13 L35 10 L31 20
                     L39 25 L28 28 L21 39 L14 28
                     L3 25 L11 20 L7 10 L17 13 Z"
                  fill="#3C9658" stroke="#216B39"
                  stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;

        markerImage = new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(parkSvg),
          new kakao.maps.Size(42, 46),
          { offset: new kakao.maps.Point(21, 40) }
        );
      }

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        image: markerImage,
        title: place.place_name
      });

      placeMarkers.push(marker);

      // 장소 정보를 팝업으로 표시
      function openPlaceInfo() {
        const link = place.place_url
          ? '<a class="info-link" href="' +
            escapeHtml(place.place_url) +
            '" target="_blank" rel="noopener noreferrer">' +
            '카카오맵에서 자세히 보기</a>'
          : "";

        const content =
          '<div class="info-content">' +
            '<div class="info-title">' +
              escapeHtml(place.place_name || "이름 정보 없음") +
            '</div>' +
            '<div class="info-address">주소: ' +
              escapeHtml(address) + '</div>' +
            '<div class="info-phone">전화: ' +
              escapeHtml(phone) + '</div>' +
            link +
          '</div>';

        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      }

      kakao.maps.event.addListener(marker, "click", openPlaceInfo);

      // 왼쪽 목록 항목
      const item = document.createElement("li");
      item.className = "place-item";
      item.tabIndex = 0;
      item.setAttribute("role", "button");

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = (index + 1) + ". " + place.place_name;

      const category = document.createElement("div");
      category.className = "place-category";
      category.textContent =
        place.category_group_name || place.category_name || "장소";

      const addressElement = document.createElement("div");
      addressElement.className = "place-address";
      addressElement.textContent = address;

      const phoneElement = document.createElement("div");
      phoneElement.className = "place-phone";
      phoneElement.textContent = phone;

      item.append(name, category, addressElement, phoneElement);

      if (place.place_url) {
        const linkElement = document.createElement("a");
        linkElement.className = "place-link";
        linkElement.href = place.place_url;
        linkElement.target = "_blank";
        linkElement.rel = "noopener noreferrer";
        linkElement.textContent = "카카오맵에서 자세히 보기";
        linkElement.addEventListener("click", function (event) {
          event.stopPropagation();
        });
        item.appendChild(linkElement);
      }

      item.addEventListener("click", function () {
        map.panTo(position);
        openPlaceInfo();
      });

      item.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          map.panTo(position);
          openPlaceInfo();
        }
      });

      resultList.appendChild(item);
    }

    // HTML에 표시할 문자열의 특수문자 처리
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    // 페이지가 열리면 카카오맵 SDK 불러오기
    loadKakaoMap();
  </script>
</body>
</html>
